version: 2
updates:
  # httpx is pinned deliberately (the guarded transport reaches into httpcore
  # pool internals), so a major bump needs review rather than an auto-merge.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "ruff"
          - "pytest*"
          - "hypothesis"
          - "vulture"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
