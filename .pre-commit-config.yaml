repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: guard-public
        name: no secrets, internal refs or home paths
        entry: python3 scripts/guard_public.py
        language: system
        # Every file type, not just Python: the references this catches turn up
        # in README and .env.example as readily as in source.
        types: [text]
      - id: public-commit-email
        name: commit email is not a work address
        # The work address already in this repository's history cannot be
        # removed from a public repo with any confidence, so the control has to
        # be preventing the next one.
        entry: python3 scripts/guard_public.py --check-author
        language: system
        pass_filenames: false
      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
